<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Solution in Code</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Solution in Code: desenvolvimento de sistemas pessoais e empresariais, apps e ferramentas com IA e agentes.">
  <!-- Prévia ao compartilhar o link (WhatsApp, LinkedIn, Facebook, X). A versão clara está em brand/og-image-light.png. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Solution in Code">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Solution in Code — Código que resolve">
  <meta property="og:description" content="Desenvolvimento de sistemas pessoais e empresariais, apps e ferramentas com IA e agentes.">
  <meta property="og:image" content="https://solutionincode.com.br/brand/og-image-dark.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo da Solution in Code com o slogan Código que resolve">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#fafaf8">
  <script>
    // Tema antes da primeira pintura (sem piscar): escolha salva ou tema do sistema. O header troca depois.
    (function () {
      var tema = null;
      try { tema = localStorage.getItem('theme'); } catch (e) {}
      if (tema !== 'dark' && tema !== 'light') {
        tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = tema;
      document.querySelector('meta[name="theme-color"]').content = tema === 'dark' ? '#121212' : '#fafaf8';
    })();
  </script>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
